<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root {
    --bg: #fbfaf5;
    --surface: #ffffff;
    --text: #1a1c19;
    --muted: #5c6159;
    --accent: #2f7a34;
    --border: #e3e2da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160f;
      --surface: #1c1f19;
      --text: #e6e5de;
      --muted: #a2a79c;
      --accent: #7fc784;
      --border: #2d3129;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
  header.site {
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header.site .wrap {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding-top: 18px; padding-bottom: 18px;
  }
  .brand {
    font-weight: 800; font-size: 19px; letter-spacing: -0.3px;
    color: var(--text); text-decoration: none;
  }
  nav a {
    color: var(--muted); text-decoration: none; font-size: 15px; margin-left: 18px;
  }
  nav a:hover { color: var(--accent); }
  main { padding: 40px 0 64px; }
  h1 { font-size: 34px; line-height: 1.2; letter-spacing: -0.8px; margin: 0 0 16px; }
  h2 { font-size: 22px; letter-spacing: -0.3px; margin: 38px 0 12px; }
  h3 { font-size: 18px; margin: 28px 0 10px; }
  p, li { color: var(--text); }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
  code { background: var(--surface); padding: 2px 5px; border-radius: 4px; font-size: 90%; }
  footer.site {
    border-top: 1px solid var(--border); padding: 24px 0 48px;
    color: var(--muted); font-size: 14px;
  }
  footer.site a { color: var(--muted); }
  @media (max-width: 480px) {
    h1 { font-size: 27px; }
    nav a { margin-left: 12px; font-size: 14px; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.brand | default: site.title }}</a>
    <nav>
      <a href="{{ '/privacy' | relative_url }}">Privacy</a>
      <a href="{{ '/terms' | relative_url }}">Terms</a>
    </nav>
  </div>
</header>
<main><div class="wrap">
{{ content }}
</div></main>
<footer class="site"><div class="wrap">
  {{ site.company }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a>
</div></footer>
</body>
</html>
